[package]
name = "mew-desktop"
version = "0.1.0"
description = "Mew for Windows: a Tauri shell around the Mew web app"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "mew_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Pinned to releases at least 14 days old when added (the same rule as the JS workspace).
[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "dynamic-acl"] }
tauri-plugin-notification = "=2.5.1"
serde = { version = "1.0.228", features = ["derive"] }
# Already in the tree through Tauri; used directly for Screen Coach's local settings file.
serde_json = "1.0.154"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "=2.4.0"

# Screen Coach's native code (capture, encoding, the capture indicator). The same version Tauri
# already depends on, so no new crate enters the tree.
[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
  "Foundation",
  "Foundation_Metadata",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_ErrorReporting",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
