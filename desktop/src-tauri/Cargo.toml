[package]
name = "mew-desktop"
version = "0.1.0"
description = "Mew for Windows: a Tauri shell around the Mew web app"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "mew_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Pinned to releases at least 14 days old when added (the same rule as the JS workspace).
[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "dynamic-acl"] }
tauri-plugin-notification = "=2.5.1"
serde = { version = "1.0.228", features = ["derive"] }
# Already in the tree through Tauri; used directly by Screen Coach (its local settings file, and
# spotting sensitive text to redact).
serde_json = "1.0.154"
regex = "1.13.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "=2.4.0"
# Signing in through the browser: the website's neb:// link back reaches the running app.
tauri-plugin-deep-link = "=2.6.2"
tauri-plugin-single-instance = { version = "=2.5.4", features = ["deep-link"] }
# In-app updates: finds, verifies (minisign) and installs a signed new version.
tauri-plugin-updater = "=2.14.0"

# Screen Coach's native code (capture, encoding, the capture indicator). The same version Tauri
# already depends on, so no new crate enters the tree.
# WinRT async operations (Windows' media session); already in the tree through `windows`.
[target.'cfg(windows)'.dependencies.windows-future]
version = "=0.3.2"
default-features = false

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
  "Foundation",
  "Foundation_Collections",
  "Foundation_Metadata",
  "Graphics",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_UI_Input",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Graphics_Imaging",
  "Media",
  "Media_Control",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Networking_WinHttp",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ErrorReporting",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
