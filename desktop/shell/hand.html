  <body class="hand">
    <!-- Neb's hand: Neb's own cursor, beside the student's. Rust moves its window (the arrow's
         tip is the window's top-left corner plus 4 px); click-through, so it's never in the way. -->

      <circle class="ring" cx="4" cy="4" r="3" />
      <path class="arrow" d="M4 4 L4 27 L10.5 21.5 L15 31 L19.5 29 L15 19.5 L23 19 Z" />
      <circle class="tag" cx="29" cy="30" r="7" />
      <path
        class="mark"
        d="M25.5 33 V29.5 C25.5 27 27 26 28.8 26 C30.6 26 32 27 32 29.5 V31.5 L33.2 32.8"
      />
    </svg>
