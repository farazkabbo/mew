<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- No network: the crops come from Rust's in-memory mewhandoff:// handler, the rest by IPC. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src http://mewhandoff.localhost; connect-src ipc: http://ipc.localhost"
    />
    <title>Hand off · Neb</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="screen-coach.css" />
    <style>
      main.handoff {
        display: grid;
        grid-template-columns: 3fr 2fr;
        gap: 24px;
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }
      .handoff label {
        display: block;
        margin-top: 10px;
        font-weight: 600;
      }
      .handoff textarea,
      .handoff input[type="text"],
      .handoff input[type="email"] {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        font: inherit;
        padding: 6px 8px;
      }
      .handoff textarea {
        min-height: 64px;
      }
      .moments {
        display: grid;
        gap: 12px;
      }
      .moment {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 8px;
      }
      .moment .frame {
        position: relative;
        cursor: crosshair;
      }
      .moment img {
        display: block;
        width: 100%;
        border-radius: 4px;
      }
      .moment .box {
        position: absolute;
        border: 2px dashed #6b4ee6;
        background: rgba(107, 78, 230, 0.25);
      }
      .moment.off {
        opacity: 0.45;
      }
      .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        background: #efeaff;
      }
      footer.send {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: end;
      }
      .progress {
        padding: 48px;
        text-align: center;
      }
    </style>
    <script src="handoff.js" defer></script>
  </head>
  <body>
    <p class="hint" style="text-align: center">
      Handoff is being built. Nothing leaves this computer until you press Send.
    </p>
    <div id="progress" class="progress" role="status" aria-live="polite">
      Reading your last 90 minutes…
    </div>
    <main id="preview" class="handoff" hidden>
      <section aria-labelledby="brief-heading">
        <h1 id="brief-heading">Hand off</h1>
        <p>
          <span id="hidden-badge" class="badge"></span>
          <button type="button" id="hide-names" hidden>Hide all names</button>
        </p>
        <p id="names-note" class="hint" hidden></p>
        <label for="title">Title</label>
        <input type="text" id="title" maxlength="120" />
        <label for="where">Where</label>
        <textarea id="where" maxlength="600"></textarea>
        <label for="goal">Goal</label>
        <textarea id="goal" maxlength="600"></textarea>
        <label for="tried">Tried (one per line)</label>
        <textarea id="tried"></textarea>
        <label for="blockers">Failed or blocked by (one per line)</label>
        <textarea id="blockers"></textarea>
        <label for="next">Next steps (one per line; a command after "$ ")</label>
        <textarea id="next"></textarea>
        <label for="questions">Open questions (one per line)</label>
        <textarea id="questions"></textarea>
      </section>
      <section aria-labelledby="moments-heading">
        <h2 id="moments-heading">Moments</h2>
        <p class="hint">Untick a moment to leave it out. Drag on a picture to hide part of it.</p>
        <div id="moments" class="moments"></div>
      </section>
      <footer class="send">
        <div style="flex: 2">
          <label for="to">To (email; several separated by commas)</label>
          <input type="email" id="to" list="recent" multiple />
          <datalist id="recent"></datalist>
        </div>
        <div>
          <label for="name">Your name</label>
          <input type="text" id="name" maxlength="80" />
        </div>
        <div>
          <label for="expiry">Expires</label>
          <select id="expiry">
            <option value="1">In 24 hours</option>
            <option value="7">In 7 days</option>
            <option value="30">In 30 days</option>
          </select>
        </div>
        <button type="button" class="primary" id="send">Send</button>
        <button type="button" id="copy">Send and copy link</button>
        <button type="button" id="cancel">Cancel</button>
        <p id="notice" role="status" style="flex-basis: 100%"></p>
      </footer>
    </main>
    <div id="empty" class="progress" hidden>
      <p>Circle the important bits first, or hand off with just a note.</p>
      <button type="button" id="close-empty">Close</button>
    </div>
  </body>
</html>
