<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src ipc: http://ipc.localhost"
    />
    <title>Circle &amp; Ask · Neb</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="overlay.css" />
    <script src="gen/circle-card.js" defer></script>
  </head>
  <body class="card">
    <main class="circle-card" id="card" data-mode="ask" aria-label="Circle and Ask">
      <p class="card-top" id="card-top"></p>
      <p class="card-text" id="card-text" aria-live="polite"></p>
      <ul class="card-chips" id="card-chips"></ul>
      <div class="card-place" aria-live="polite">
        <p class="card-place-line" id="card-place-line"></p>
        <ul class="card-chips" id="card-place-chips"></ul>
      </div>
      <form class="card-ask" id="card-ask">
        <label class="sr-only" for="card-input">Your question</label>
        <input id="card-input" type="text" maxlength="500" autocomplete="off" />
        <button
          type="button"
          class="card-mic"
          id="card-mic"
          aria-pressed="false"
          aria-label="Say it instead"
          title="Say it instead: click, speak, click again"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" />
            <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" />
          </svg>
        </button>
      </form>
      <div class="card-buttons" id="card-buttons"></div>
    </main>
  </body>
</html>
