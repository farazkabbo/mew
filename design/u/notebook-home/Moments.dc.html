<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook home · Moments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Inter:wght@400;500;600&amp;family=Pixelify+Sans:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="{{rootStyle}}">

<aside style="width: 240px; flex: none; background: var(--paper); border-right: 1px solid var(--line); padding: 20px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<span style="width: 26px; height: 26px; border-radius: 999px; background: var(--neb); display: inline-flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span style="font-size: 19px; font-weight: 600; letter-spacing: 0.02em">neb</span>
</div>
<nav aria-label="Notebooks">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted)">Notebooks</span>
<button type="button" aria-label="New notebook" style="width: 32px; height: 32px; border: none; background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<a href="#" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"></path></svg>My first notebook</a>
<a href="#" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--sunk)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 7V4H6l6 8-6 8h12v-3"></path></svg>Business Mathematics</a>
<a href="#" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"></path></svg>Advanced DSA</a>
</nav>
</aside>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="height: 64px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 28px 0 20px; border-bottom: 1px solid var(--line)">
<a href="#" aria-label="Back to the desk" style="width: 44px; height: 44px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<nav aria-label="Breadcrumb" style="font-size: 14px; display: flex; align-items: center; gap: 8px">
<a href="#" style="color: var(--muted); text-decoration: none">Notebooks</a>
<span style="color: var(--muted)" aria-hidden="true">›</span>
<span style="font-weight: 600">Business Mathematics</span>
</nav>
<div style="flex: 1"></div>
<div role="radiogroup" aria-label="How much neb marks" style="display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--sunk)">
<button type="button" role="radio" aria-checked="false" style="height: 34px; padding: 0 14px; border-radius: 999px; border: none; background: transparent; color: var(--muted); font: 500 13px Inter, sans-serif; cursor: pointer">Quiet</button>
<button type="button" role="radio" aria-checked="true" style="height: 34px; padding: 0 14px; border-radius: 999px; border: none; background: var(--paper-hi); color: var(--ink); font: 600 13px Inter, sans-serif; cursor: pointer; box-shadow: 0 1px 2px rgba(30,29,26,.18)">Hint</button>
<button type="button" role="radio" aria-checked="false" style="height: 34px; padding: 0 14px; border-radius: 999px; border: none; background: transparent; color: var(--muted); font: 500 13px Inter, sans-serif; cursor: pointer">Coach</button>
</div>
</div>

<main style="flex: 1; padding: 40px 40px 64px; box-sizing: border-box">
<div style="max-width: 1080px; margin: 0 auto">

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
<div style="width: 52px; height: 68px; flex: none; border-radius: 3px 9px 9px 3px; background: #9DB8D9; box-shadow: inset 7px 0 0 rgba(0,0,0,.14), var(--sh-2); display: flex; align-items: center; justify-content: center" aria-hidden="true">
<span style="width: 30px; height: 30px; border-radius: 4px; background: #FFFEFB; display: inline-flex; align-items: center; justify-content: center; color: #1E1D1A; margin-left: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 7V4H6l6 8-6 8h12v-3"></path></svg></span>
</div>
<div style="min-width: 0">
<h1 style="margin: 0; font: 400 56px/1 'Instrument Serif', serif; letter-spacing: -0.01em">Business Mathematics</h1>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 12px; font-size: 14px; color: var(--muted)">
<span>0 chapters · 6 pages</span>
<span style="width: 4px; height: 4px; border-radius: 999px; background: var(--line)" aria-hidden="true"></span>
<label style="display: inline-flex; align-items: center; gap: 8px">Subject
<span style="position: relative; display: inline-flex">
<select value="Maths" onChange="{{noop}}" style="appearance: none; -webkit-appearance: none; height: 34px; padding: 0 34px 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: 500 14px Inter, sans-serif; cursor: pointer">
<option>Not set</option><option>Maths</option><option>Physics</option><option>Chemistry</option><option>Biology</option><option>Programming</option><option>History</option><option>Languages</option><option>Other</option>
</select>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 12px; top: 9px; pointer-events: none; color: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg>
</span>
</label>
</div>
</div>
</div>

<div role="status" style="margin-top: 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 14px 14px 16px; border-radius: 14px; background: var(--neb-wash)">
<span style="width: 34px; height: 34px; flex: none; border-radius: 999px; background: var(--neb); display: inline-flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<div style="flex: 1 1 280px; min-width: 0">
<div style="font: 500 15px 'Pixelify Sans', monospace; color: var(--neb-ink)">from what you saved here</div>
<div style="font-size: 14px; color: var(--ink); opacity: .8">1 check due · about 2 min</div>
</div>
<button type="button" style="height: 44px; padding: 0 22px; border-radius: 999px; border: none; background: var(--neb); color: #FFFFFF; font: 600 15px Inter, sans-serif; cursor: pointer">Quick check</button>
</div>

<div role="tablist" aria-label="Notebook" style="display: flex; gap: 6px; align-items: flex-end; margin-top: 36px">
<button type="button" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border: none; border-radius: 12px 12px 0 0; background: var(--sunk); color: var(--muted); font: 500 15px Inter, sans-serif; cursor: pointer">Pages<span style="opacity: .7">6</span></button>
<button type="button" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border: none; border-radius: 12px 12px 0 0; background: var(--sunk); color: var(--muted); font: 500 15px Inter, sans-serif; cursor: pointer">Study</button>
<button type="button" role="tab" aria-selected="true" style="display: inline-flex; align-items: center; gap: 8px; height: 52px; padding: 0 22px; border: none; border-radius: 12px 12px 0 0; background: var(--paper); color: var(--ink); font: 600 15px Inter, sans-serif; cursor: pointer">Moments<span style="font-weight: 500; opacity: .7">10</span></button>
</div>
<div role="tabpanel" style="background: var(--paper); border-radius: 16px; box-shadow: var(--sh-2); padding: 28px 32px 40px">

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<label style="position: relative; flex: 1 1 260px; min-width: 0; display: flex">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search moments</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 16px; top: 13px; color: var(--muted)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" placeholder="Search what you asked or saved" style="flex: 1; min-width: 0; height: 44px; padding: 0 16px 0 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper-hi); color: var(--ink); font: 400 15px Inter, sans-serif">
</label>
<div role="radiogroup" aria-label="Source" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{f.on}}" style="{{f.style}}">{{f.label}}<span style="opacity: .65; font-variant-numeric: tabular-nums">{{f.count}}</span></button>
</sc-for>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--muted)">
Group by
<div role="radiogroup" aria-label="Group by" style="display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--sunk)">
<button type="button" role="radio" aria-checked="true" style="height: 30px; padding: 0 12px; border-radius: 999px; border: none; background: var(--paper-hi); color: var(--ink); font: 600 13px Inter, sans-serif; cursor: pointer">Source</button>
<button type="button" role="radio" aria-checked="false" style="height: 30px; padding: 0 12px; border-radius: 999px; border: none; background: transparent; color: var(--muted); font: 500 13px Inter, sans-serif; cursor: pointer">Day</button>
</div>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<section style="margin-top: 28px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; margin-bottom: 14px">
<span style="width: 40px; height: 40px; flex: none; border-radius: 10px; background: var(--sunk); display: inline-flex; align-items: center; justify-content: center" aria-hidden="true">
<sc-if value="{{g.pdf}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M16 13H8M16 17H8M10 9H8"></path></svg></sc-if>
<sc-if value="{{g.app}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg></sc-if>
</span>
<div style="flex: 1 1 240px; min-width: 0">
<h2 style="margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.title}}</h2>
<div style="font-size: 13px; color: var(--muted)">{{g.meta}}</div>
</div>
<sc-if value="{{g.pdf}}" hint-placeholder-val="{{ true }}">
<button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--ink); background: transparent; color: var(--ink); font: 600 13px Inter, sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>Open PDF</button>
</sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px">
<sc-for list="{{g.items}}" as="m" hint-placeholder-count="3">
<article style="background: var(--paper-hi); border-radius: 12px; box-shadow: var(--sh-2); overflow: hidden; display: flex; flex-direction: column">
<div style="position: relative; height: 128px; background: #FFFEFB; border-bottom: 1px solid var(--line)">
<svg width="100%" height="128" viewBox="0 0 300 128" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<rect x="22" y="18" width="{{m.w1}}" height="6" rx="3" fill="#B9AF9A"></rect>
<rect x="22" y="36" width="{{m.w2}}" height="5" rx="2.5" fill="#DDD5C4"></rect>
<rect x="22" y="50" width="{{m.w3}}" height="5" rx="2.5" fill="#DDD5C4"></rect>
<rect x="22" y="64" width="{{m.w4}}" height="5" rx="2.5" fill="#DDD5C4"></rect>
<rect x="22" y="84" width="{{m.w2}}" height="5" rx="2.5" fill="#DDD5C4"></rect>
<rect x="22" y="98" width="{{m.w1}}" height="5" rx="2.5" fill="#DDD5C4"></rect>
<ellipse cx="{{m.cx}}" cy="{{m.cy}}" rx="{{m.rx}}" ry="15" fill="none" stroke="#6B4EE6" stroke-width="2.5" transform="rotate(-3 {{m.cx}} {{m.cy}})"></ellipse>
</svg>
<sc-if value="{{m.due}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; left: 10px; top: 10px; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--neb-wash); color: var(--neb-ink); font: 500 13px 'Pixelify Sans', monospace; display: inline-flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 999px; background: var(--neb)"></span>check due</span>
</sc-if>
</div>
<div style="padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; flex: 1">
<a href="#" style="font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--ink); text-decoration: none; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">{{m.q}}</a>
<div style="display: flex; align-items: center; gap: 4px; margin-top: auto">
<a href="#" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px 0 4px; color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 600"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4l14 8-14 8z"></path></svg>Replay</a>
<span style="font-size: 13px; color: var(--muted)">{{m.when}}</span>
<span style="flex: 1"></span>
<button type="button" aria-label="Open source" title="{{m.src}}" style="width: 36px; height: 36px; border-radius: 999px; border: none; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></button>
<button type="button" aria-label="Check against my notes" title="Check against my notes" style="width: 36px; height: 36px; border-radius: 999px; border: none; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path><path d="m9 9.5 2 2 4-4"></path></svg></button>
</div>
</div>
</article>
</sc-for>
</div>
<sc-if value="{{g.hasMore}}" hint-placeholder-val="{{ true }}">
<button type="button" style="margin-top: 16px; height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 14px Inter, sans-serif; cursor: pointer">{{g.more}}</button>
</sc-if>
</section>
</sc-for>

</div>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"night":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1280}}'>
class Component extends DCLogic {
renderVals() {
var night = !!this.props.night;
var t = night
? { desk: '#1B1F23', paper: '#22272C', 'paper-hi': '#2A3036', ink: '#ECE6D8', muted: '#A9A294', line: '#3A4047', neb: '#9C86FF', 'neb-ink': '#C9BCFF', 'neb-wash': '#2C2550', 'on-ink': '#1B1F23', sunk: '#2E3439', 'sh-2': '0 10px 24px -14px #000000AA' }
: { desk: '#ECE6D8', paper: '#FBF8F0', 'paper-hi': '#FFFEFB', ink: '#1E1D1A', muted: '#5F5A50', line: '#D3CAB7', neb: '#6B4EE6', 'neb-ink': '#3F2BA0', 'neb-wash': '#F1EDFF', 'on-ink': '#FBF8F0', sunk: '#E2DACA', 'sh-2': '0 10px 24px -14px #1E1D1A66' };
var vars = Object.keys(t).map(function (k) { return '--' + k + ': ' + t[k]; }).join('; ');
var filters = [['All', '10', true], ['Videos', '0', false], ['Web pages', '0', false], ['PDFs', '9', false], ['Apps', '1', false]].map(function (f) {
return { label: f[0], count: f[1], on: f[2], style: 'height: 36px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font: ' + (f[2] ? '600' : '500') + ' 13px Inter, sans-serif; ' + (f[2] ? 'background: var(--ink); color: var(--on-ink); border: 1px solid var(--ink)' : 'background: transparent; color: ' + (f[1] === '0' ? 'var(--muted)' : 'var(--ink)') + '; border: 1px solid var(--line)') };
});
var shapes = [[180, 220, 150, 200, 150, 42, 90], [210, 160, 230, 120, 120, 70, 70], [150, 240, 200, 170, 170, 56, 100], [230, 190, 120, 210, 110, 98, 80], [200, 230, 180, 140, 160, 66, 120], [170, 200, 220, 150, 140, 84, 90]];
function mk(q, i, due, src) { var s = shapes[i % shapes.length]; return { q: q, when: 'Mon', due: due, src: src, w1: s[0], w2: s[1], w3: s[2], w4: s[3], cx: s[4], cy: s[5], rx: s[6] }; }
var pdf = 'Chapter ONE- InClassQuestions (3).pdf';
var groups = [
{ title: pdf, meta: 'PDF · Personal · 9 moments · Mon', pdf: true, app: false, hasMore: true, more: 'Show 3 more from this PDF', items: [
mk('Explain this equation.', 0, false, pdf),
mk('The formula that I would have to use for part A. I’m a bit confused.', 1, false, pdf),
mk('I’m confused on how to use the formula on part A. Can you please explain what I have to use and why?', 2, false, pdf),
mk('Can you please help me with the single payment equivalent to multiple debts using simple interest?', 3, true, pdf),
mk('Explain this', 4, false, pdf),
mk('Explain this', 5, false, pdf)
] },
{ title: 'Recordly', meta: 'App · 1 moment · Mon', pdf: false, app: true, hasMore: false, more: '', items: [
mk('2. A $1200 loan has a maturing value of $1260, due at the end of 9 months. The annual simple discount rate ass…', 1, false, 'Recordly')
] }
];
return {
rootStyle: vars + '; min-height: 100vh; display: flex; background: var(--desk); color: var(--ink); font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45',
noop: function () {}, filters: filters, groups: groups
};
}
}
</script>
</body>
</html>
